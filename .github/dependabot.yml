version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "pydantic-core"
    groups:
      url-extractors:
        patterns:
          - "yt-dlp*"
          - "gallery-dl"
      python-deps:
        patterns:
          - "*"
        exclude-patterns:
          - "yt-dlp*"
          - "gallery-dl"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "pip prod"
      prefix-development: "pip dev"
    groups:
      action-dependencies:
        patterns:
          - "*"
    assignees:
      - "buildplan"

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - "dependencies"
      - "docker"
    groups:
      action-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "[docker] "
    assignees:
      - "buildplan"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "github-actions"
    groups:
      action-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "gh-actions"
    assignees:
      - "buildplan"
